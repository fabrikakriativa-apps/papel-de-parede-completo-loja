name: Official catalog completeness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_homefinish_official.py'
      - 'scripts/diagnose_homefinish_endpoints.py'
      - 'scripts/diagnose_wiler_official.py'
      - 'scripts/diagnose_wiler_vtex.py'
      - 'scripts/summarize_wiler_network.py'
      - 'scripts/audit_wiler_official.py'
      - '.github/workflows/official-completeness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser for protected official pages
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps

      - name: Probe Home Finish structured official endpoints
        continue-on-error: true
        run: python scripts/diagnose_homefinish_endpoints.py

      - name: Audit Home Finish against official collections
        continue-on-error: true
        run: python scripts/audit_homefinish_official.py

      - name: Diagnose Wiler official collection sources
        continue-on-error: true
        run: python scripts/diagnose_wiler_official.py

      - name: Diagnose Wiler storefront API traffic
        continue-on-error: true
        run: python scripts/diagnose_wiler_vtex.py

      - name: Summarize Wiler storefront data endpoints
        continue-on-error: true
        run: python scripts/summarize_wiler_network.py

      - name: Audit Wiler against official collections
        continue-on-error: true
        run: python scripts/audit_wiler_official.py

      - name: Commit official audit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in auditoria-homefinish-oficial.json diagnostico-homefinish-endpoints.json diagnostico-wiler-oficial.json diagnostico-wiler-vtex.json diagnostico-wiler-api-resumo.json auditoria-wiler-oficial.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Official audit unchanged"
          else
            git commit -m "Refresh official catalog completeness audit"
            git pull --rebase origin main
            git push origin main
          fi

name: Diagnose Kantai dataset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-kantai.yml'
      - 'scripts/diagnose_kantai_wix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Inspect dynamic Kantai page
        run: python scripts/diagnose_kantai_wix.py

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico-kantai.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "Update Kantai dataset diagnostic"
            git push
          fi

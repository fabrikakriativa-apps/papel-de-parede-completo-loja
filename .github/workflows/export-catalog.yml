name: Export catalog snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Package repository
        shell: bash
        run: |
          zip -rq catalog-snapshot.zip . -x '.git/*' 'catalog-snapshot.zip'

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: catalog-snapshot.zip
          if-no-files-found: error
          retention-days: 1

name: Build wallpaper style classification staging

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_style_classification.py'
      - '.github/workflows/build-style-classification.yml'
  workflow_dispatch:

concurrency:
  group: build-wallpaper-style-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CPU vision dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check pillow 'transformers==4.57.1'

      - name: Build conservative style staging
        run: python scripts/build_style_classification.py

      - name: Commit style staging
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classificacao/catalogo-estilo.json auditoria-estilo-classificacao.json
          if git diff --cached --quiet; then
            echo "Style staging unchanged"
          else
            git commit -m "Build conservative wallpaper style staging"
            git pull --rebase origin main
            git push origin main
          fi

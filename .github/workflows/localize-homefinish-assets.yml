name: Localize Home Finish external assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/localize_homefinish_external_assets.py'
      - '.github/workflows/localize-homefinish-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-homefinish-assets
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image validation dependency
        run: python -m pip install --quiet pillow

      - name: Attempt direct official BIO Habitat localization
        run: python scripts/localize_homefinish_external_assets.py

      - name: Validate safe localization state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          report = json.loads((root / 'auditoria-localizacao-homefinish.json').read_text(encoding='utf-8'))
          status = report.get('status')
          if status not in {'ok', 'bloqueado_pela_origem_http_403'}:
              raise SystemExit(f'Unexpected localization status: {status}')
          if int(report.get('itens_catalogo_preservados') or 0) != 1212:
              raise SystemExit('Catalog item count changed during localization')

          html = (root / 'index.html').read_text(encoding='utf-8')
          marker = 'let DATA='
          start = html.index(marker) + len(marker)
          data, _ = json.JSONDecoder().raw_decode(html[start:])
          if len(data) != 1212:
              raise SystemExit(f'Expected 1212 catalog items, found {len(data)}')

          external = []
          missing = []
          for item in data:
              for field in ('card', 'zoom'):
                  value = str(item.get(field) or '').strip()
                  if value.startswith(('http://', 'https://')):
                      external.append((item.get('ref'), field, value))
                  elif value:
                      path = root / value.split('?', 1)[0].split('#', 1)[0]
                      if not path.is_file():
                          missing.append((item.get('ref'), field, value))
          if missing:
              raise SystemExit(f'Local image paths are missing: {missing[:10]}')

          if status == 'ok':
              if external:
                  raise SystemExit(f'External image references remain after successful localization: {external[:5]}')
              if int(report.get('imagens_localizadas') or 0) not in {0, 28}:
                  raise SystemExit('Unexpected localized image count')
          else:
              if len(external) != 56:
                  raise SystemExit(f'Blocked state must preserve exactly 56 card/zoom URLs; found {len(external)}')
              if int(report.get('imagens_localizadas') or -1) != 0:
                  raise SystemExit('Blocked state must not leave partially localized images')

          print(json.dumps({
              'status': status,
              'catalog_items': len(data),
              'external_url_fields': len(external),
              'missing_local_assets': 0,
          }, ensure_ascii=False))
          PY
          git diff --check

      - name: Commit localization result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-localizacao-homefinish.json
          if [ -d imagens/home-finish/bio-habitat/thumbnails ]; then
            git add imagens/home-finish/bio-habitat/thumbnails
          fi
          git add index.html
          if git diff --cached --quiet; then
            echo "Localization state already recorded"
          else
            git commit -m "Record Home Finish localization state"
            git pull --rebase origin main
            git push origin main
          fi

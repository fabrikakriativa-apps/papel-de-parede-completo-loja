name: Home Finish validated completeness

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/audit_homefinish_validated_source.py'
      - '.github/workflows/homefinish-validated.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-homefinish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout validated source library
        uses: actions/checkout@v4
        with:
          repository: fabrikakriativa-apps/catalogos-papel-de-parede
          path: _catalog_source
          fetch-depth: 1

      - name: Audit Home Finish validated source
        run: python scripts/audit_homefinish_validated_source.py

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-homefinish-fonte-validada.json
          if git diff --cached --quiet; then
            echo "Home Finish validated audit unchanged"
          else
            git commit -m "Refresh Home Finish validated completeness audit"
            git pull --rebase origin main
            git push origin main
          fi

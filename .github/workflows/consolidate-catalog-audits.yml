name: Consolidate catalog audits

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'auditoria-catalogo-atual.json'
      - 'auditoria-homefinish-fonte-validada.json'
      - 'auditoria-homefinish-escopo-oficial.json'
      - 'auditoria-kantai-oficial.json'
      - 'auditoria-kantai-escopo-oficial.json'
      - 'auditoria-wiler-consolidada.json'
      - 'auditoria-wiler-escopo-oficial.json'
      - 'scripts/consolidate_catalog_audits.py'
      - 'scripts/audit_catalog_completeness.py'
      - '.github/workflows/consolidate-catalog-audits.yml'
  workflow_run:
    workflows:
      - 'Catalog health'
      - 'Home Finish validated completeness'
      - 'Official catalog completeness'
      - 'Capture official Kantai collections'
      - 'Import Wiler Texture III completeness'
      - 'Import complete Kantai collections'
      - 'Importar colecoes Kantai completas'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate current audits
        run: python scripts/consolidate_catalog_audits.py

      - name: Refresh compatibility completeness report
        run: python scripts/audit_catalog_completeness.py

      - name: Commit consolidated reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-catalogo-consolidada.json auditoria-completude.json
          if git diff --cached --quiet; then
            echo "Consolidated audits already current"
          else
            git commit -m "Refresh consolidated catalog audits"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail visibly when registered catalog needs review
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          consolidated = json.loads(Path('auditoria-catalogo-consolidada.json').read_text(encoding='utf-8'))
          compatibility = json.loads(Path('auditoria-completude.json').read_text(encoding='utf-8'))

          status = consolidated.get('status')
          compatibility_status = compatibility.get('status')
          print(f'Registered catalog status: {status}')
          print(f'Compatibility completeness status: {compatibility_status}')
          print(f'Portfolio scope status: {consolidated.get("escopo_status")}')
          print(f'Portfolio statuses: {consolidated.get("portfolio_statuses")}')

          if status != 'completo_nas_fontes_auditadas':
              raise SystemExit('Registered catalog review required: see auditoria-catalogo-consolidada.json')
          if compatibility_status != status:
              raise SystemExit('Compatibility completeness report disagrees with consolidated audit')
          if compatibility.get('comparacao_biblioteca_fisica') != 'descontinuada':
              raise SystemExit('Legacy physical-library comparison must remain disabled')
          PY

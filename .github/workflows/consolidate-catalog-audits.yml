name: Consolidate catalog audits

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'auditoria-catalogo-atual.json'
      - 'auditoria-homefinish-fonte-validada.json'
      - 'auditoria-homefinish-escopo-oficial.json'
      - 'auditoria-kantai-oficial.json'
      - 'auditoria-kantai-escopo-oficial.json'
      - 'auditoria-wiler-consolidada.json'
      - 'auditoria-wiler-escopo-oficial.json'
      - 'scripts/consolidate_catalog_audits.py'
      - '.github/workflows/consolidate-catalog-audits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate current audits
        run: python scripts/consolidate_catalog_audits.py

      - name: Commit consolidated report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-catalogo-consolidada.json
          if git diff --cached --quiet; then
            echo "Consolidated audit already current"
          else
            git commit -m "Refresh consolidated catalog audit"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail visibly when registered catalog needs review
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('auditoria-catalogo-consolidada.json').read_text(encoding='utf-8'))
          status = report.get('status')
          print(f'Registered catalog status: {status}')
          print(f'Portfolio scope status: {report.get("escopo_status")}')
          print(f'Portfolio statuses: {report.get("portfolio_statuses")}')
          if status != 'completo_nas_fontes_auditadas':
              raise SystemExit('Registered catalog review required: see auditoria-catalogo-consolidada.json')
          PY

name: Calibrate wallpaper style classifier

on:
  push:
    branches: [main]
    paths:
      - 'scripts/calibrate_style_classifier.py'
      - '.github/workflows/calibrate-style-classifier.yml'
  workflow_dispatch:

concurrency:
  group: calibrate-wallpaper-style-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CPU vision dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check pillow 'transformers==4.57.1'

      - name: Run style calibration sample
        run: python scripts/calibrate_style_classifier.py

      - name: Commit calibration reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classificacao/amostra-estilo-clip.json auditoria-estilo-calibracao.json
          if git diff --cached --quiet; then
            echo "Style calibration unchanged"
          else
            git commit -m "Record wallpaper style calibration"
            git pull --rebase origin main
            git push origin main
          fi

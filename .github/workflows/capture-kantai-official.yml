name: Capture official Kantai collections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-kantai-official.yml'
      - 'scripts/capture_kantai_official.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture official public gallery data
        run: python scripts/capture_kantai_official.py

      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditoria-kantai-oficial.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Update official Kantai collection audit"
            git push
          fi

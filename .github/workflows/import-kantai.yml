name: Importar colecoes Kantai completas

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-kantai.yml'
      - 'scripts/import_kantai.py'
      - 'scripts/import_kantai_v2.py'

permissions:
  contents: write

concurrency:
  group: import-kantai
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Importar e validar Kantai
        run: python scripts/import_kantai_v2.py

      - name: Verificar diff
        run: git diff --check

      - name: Publicar alteracoes validadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html imagens/kantai auditoria-kantai.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git commit -m 'Complete Kantai wallpaper collections'
          git push

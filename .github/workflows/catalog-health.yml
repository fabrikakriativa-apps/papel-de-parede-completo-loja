name: Catalog health

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/catalog_inventory.py'
      - 'scripts/optimize_catalog_html.py'
      - 'scripts/diagnose_image_render.py'
      - '.github/workflows/catalog-health.yml'
  workflow_run:
    workflows:
      - 'Localize Home Finish external assets'
      - 'Import Wiler Texture III completeness'
      - 'Import complete Kantai collections'
      - 'Importar colecoes Kantai completas'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add safe lazy image loading
        run: python scripts/optimize_catalog_html.py

      - name: Inventory current published catalog
        run: python scripts/catalog_inventory.py

      - name: Diagnose dynamic image rendering
        run: python scripts/diagnose_image_render.py

      - name: Commit health fixes and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auditoria-performance.json auditoria-catalogo-atual.json diagnostico-render-imagens.json
          if git diff --cached --quiet; then
            echo "Catalog already healthy"
          else
            git commit -m "Refresh catalog health diagnostics"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Validate curated catalog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_user_classifications.py
          python - <<'PY'
from pathlib import Path
import json, re
s=Path("index.html").read_text(encoding="utf-8")
data=json.loads(re.search(r'let DATA=(\[.*?\]);\s*const q=',s,re.S).group(1))
by={x["ref"]:x for x in data}
checks={
 "BH101010":{"cor":["Azul","Multicolorido"]},
 "BH101011":{"cor":["Multicolorido"]},
 "84384":{"cor":["Verde"],"estilo":["Floral"]},
 "AD300111R":{"cor":["Cinza"]},
}
for ref,expected in checks.items():
    for field,value in expected.items():
        if by[ref].get(field) != value:
            raise SystemExit(f"{ref} {field}: {by[ref].get(field)} != {value}")
if sum(1 for x in data if x.get("perfil")=="Geral") != 990:
    raise SystemExit("Unexpected Geral profile count")
if sum(1 for x in data if x.get("perfil")=="Infantil") != 276:
    raise SystemExit("Unexpected Infantil profile count")
print("Validation OK")
PY

      - name: Commit published revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/publish-revision-07.yml
          git add -A
          git commit -m "Publish catalog revision 07 with 1266 curated items"
          git push

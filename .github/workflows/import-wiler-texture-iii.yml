name: Import Wiler Texture III completeness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_wiler_texture_iii.py'
      - 'scripts/import_wiler_texture_iii_v2.py'
      - 'scripts/import_wiler_texture_iii_v3.py'
      - '.github/workflows/import-wiler-texture-iii.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install importer dependencies
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install chromium --with-deps

      - name: Import six confirmed Texture III references
        run: python scripts/import_wiler_texture_iii_v3.py

      - name: Validate catalog integrity
        run: |
          python scripts/audit_catalog.py
          python scripts/audit_collection_completeness.py

      - name: Commit validated import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auditoria-import-texture-iii.json imagens/wiler/texture-iii/thumbnails/TX-3010.jpg imagens/wiler/texture-iii/thumbnails/TX-3019.jpg imagens/wiler/texture-iii/thumbnails/TX-3037.jpg imagens/wiler/texture-iii/thumbnails/TX-3050.jpg imagens/wiler/texture-iii/thumbnails/TX-3052.jpg imagens/wiler/texture-iii/thumbnails/TX-3054.jpg
          if git diff --cached --quiet; then
            echo "Texture III already complete; nothing to commit"
          else
            git commit -m "Complete Wiler Texture III references"
            git pull --rebase origin main
            git push origin main
          fi
